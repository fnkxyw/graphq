name: Release

# Push a tag like v1.0.0 to build graphq.dmg and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Test
        run: make test
      - name: Build DMG
        run: make dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/graphq.dmg \
            --title "graphq $GITHUB_REF_NAME" --generate-notes
